<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Three ways to gain a strategic capability</title>
<desc id="d">Editorial framework showing Buy, Build and Partner decisions with their trade-offs. A conceptual illustration, not company-specific data.</desc>
<rect width="1200" height="620" fill="#f1f2ec"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#172d3d">
<text x="85" y="96" font-size="18" letter-spacing="5" fill="#9e674b">DEAL THEORY / STRATEGY NOTE</text>
<text x="85" y="165" font-family="Georgia,serif" font-size="52">One need. Three choices.</text>
<text x="85" y="214" font-size="20" fill="#5f6d74">Management should compare ownership with its alternatives.</text>
<g>
<rect x="85" y="286" width="320" height="240" rx="12" fill="#152e3d"/>
<text x="118" y="350" font-family="Georgia,serif" font-size="42" fill="#f7f3ea">BUY</text>
<path d="M118 380 H370" stroke="#d8a077" stroke-width="3"/>
<text x="118" y="422" font-size="20" fill="#ffffff">Faster control</text>
<text x="118" y="458" font-size="20" fill="#becbd0">Purchase price + integration</text>
</g>
<g>
<rect x="441" y="286" width="320" height="240" rx="12" fill="#dce5e2"/>
<text x="474" y="350" font-family="Georgia,serif" font-size="42">BUILD</text>
<path d="M474 380 H725" stroke="#769b8b" stroke-width="3"/>
<text x="474" y="422" font-size="20">Internal capability</text>
<text x="474" y="458" font-size="20" fill="#536c67">Time + execution risk</text>
</g>
<g>
<rect x="797" y="286" width="320" height="240" rx="12" fill="#eadfd4"/>
<text x="830" y="350" font-family="Georgia,serif" font-size="42">PARTNER</text>
<path d="M830 380 H1080" stroke="#c58f6d" stroke-width="3"/>
<text x="830" y="422" font-size="20">Flexibility + shared effort</text>
<text x="830" y="458" font-size="20" fill="#7c6355">Less control + shared upside</text>
</g>
</g>
<text x="85" y="575" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#687780">Conceptual framework · Created for Cui Bono · No quantitative assumptions</text>
</svg>
