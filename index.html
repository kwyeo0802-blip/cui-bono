 <a href="#home" class="mark"><span class="monogram">C</span><span class="brandname" id="brand">Cui Bono</span></a>
 <nav class="nav" id="nav"><button data-route="home">Home</button><button data-route="library">Deal library</button><button data-route="framework">Our framework</button><button data-route="about">About the writer</button></nav>
 <div class="head-right">INDEPENDENT RESEARCH JOURNAL</div><button class="mobile-menu" id="menu" aria-label="Toggle menu">☰</button>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><div class="footer-top"><div><h2>Cui Bono<span style="color:#c38766">.</span></h2><p>Who benefits. Who pays. Who bears the risk.</p></div><nav class="foot-nav"><a href="#home">Home</a><a href="#library">Deal library</a><a href="#framework">Framework</a><a href="#about">About</a></nav></div><div class="foot-end"><span>Independent educational research. Not investment advice. Published facts are distinguished from forward-looking claims and original analysis.</span><span id="footdate">Source review: 06 November 2026</span></div></div></footer>
<script src="content.js"></script>
<script>
(()=>{'use strict';
const cfg=window.CUI_BONO_CONTENT||{site:{name:'Cui Bono',authorName:'Your Name'},deals:[]};const site=cfg.site, deals=cfg.deals.filter(d=>d.published);let filter='All',query='',mode='story';
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https:\/\//i.test(String(u||''))?E(u):'#';
// Only published images in the local images/ folder or absolute HTTPS photo URLs are accepted.
// Keep URL and alt/caption as plain text; do not allow arbitrary HTML in article fields.
const mediaSrc=u=>{let s=String(u||'').trim();return (/^images\/(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+\.(?:png|jpg|jpeg|webp|gif|svg)$/i.test(s)||/^https:\/\/[^\s<>"']+$/i.test(s))?E(s):''};
const figure=(src,alt,caption,kind='chapter-photo')=>{let u=mediaSrc(src);return u?`<figure class="${kind}"><img src="${u}" alt="${E(alt||'Editorial illustration for this M&A case')}" loading="lazy" decoding="async">${caption?`<figcaption>${E(caption)}</figcaption>`:''}</figure>`:''};
const date=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return E(d)}};
const app=document.getElementById('app');document.getElementById('brand').textContent=site.name||'Cui Bono';document.getElementById('footdate').textContent='Source review: '+date(site.lastReviewed||'2026-11-06');
const prompts=['What exactly has been announced, and what is still conditional?','Where does the buyer earn money—and where is its strategic gap?','Which scarce target assets are worth paying for?','How specifically does the buyer’s need connect to the target’s capability?','Why is ownership superior to building or partnering, at this moment?','What incremental cash value can justify price, financing, dilution and integration?','Who benefits, who pays, and what outcome would overturn your view?'];
const cards=arr=>arr.map(d=>`<article class="deal-card"><a href="#deal/${encodeURIComponent(d.id)}" aria-label="Read ${E(d.title)}"><div class="deal-art ${E(d.theme)}">${mediaSrc(d.heroImage)?`<img class="deal-art-img" src="${mediaSrc(d.heroImage)}" alt="${E(d.heroAlt||d.title)}" loading="lazy">`:`<span class="glyph">${E(d.buyer.split(' ')[0].slice(0,2).toUpperCase())} <span style="font-size:25px;color:var(--copper)">×</span> ${E(d.target.slice(0,2).toUpperCase())}</span>`}<small>THE DEAL / ${E(d.theme)}</small></div></a><div class="card-main"><div class="card-meta"><span>${E(d.sector)}</span><span>${date(d.announced)}</span></div><h3>${E(d.title)}</h3><p>${E(d.subtitle)}</p><div class="card-foot"><span class="pill">${E(d.status)}</span><a class="text-link" href="#deal/${encodeURIComponent(d.id)}">Explore deal <span class="arrow">↗</span></a></div></div></article>`).join('');
const featured=()=>deals[0];
function home(){const d=featured();return `<section class="hero"><div class="wrap hero-grid"><div><span class="eyebrow">${E(site.eyebrow||'AN INDEPENDENT M&A JOURNAL')}</span><h1>Behind every acquisition is <em>a question.</em></h1><p class="subhead">${E(site.description)}</p><div class="hero-actions"><a class="btn" href="#library">Explore the deals <span class="arrow">↗</span></a><a class="btn secondary" href="#framework">Learn the method →</a></div><div class="hero-foot"><span><b>01</b> Strategic motive</span><span><b>02</b> Financial logic</span><span><b>03</b> Independent judgment</span></div></div><div class="cover">${mediaSrc(site.homeCoverImage)?`<img class="cover-user-image" src="${mediaSrc(site.homeCoverImage)}" alt="${E(site.homeCoverAlt||'Cui Bono journal cover image')}"><div class="cover-user-shade"></div>`:''}<div class="cover-grid"></div><div class="cover-flare"></div><div class="cover-top"><span>THE DEAL FILES / NO. 001</span><span>ANALYSIS<br>2026</span></div><div class="cover-center"><span class="cover-a">CUI</span><span class="cover-cross">?</span><span class="cover-b">BONO</span></div><div class="cover-bottom"><strong>Who benefits from the choices behind the headlines?</strong><span>STORY<br>MEETS<br>INCENTIVES</span></div></div></div></section><div class="darkband"><div class="wrap band-inner"><span>CUI BONO? / THE BENEFICIARY TEST</span><p>${E(d?d.cuiBono:'Before judging the deal, ask who gains, who pays, and who carries the uncertainty.')}</p><button onclick="location.hash='deal/${d?encodeURIComponent(d.id):''}'">Read the case ↗</button></div></div><section class="section"><div class="wrap"><div class="sectionhead"><div><span class="eyebrow">THE LATEST RESEARCH</span><h2 class="section-title">Deals worth understanding.</h2></div><p class="subhead">Primary-source grounded research. Original interpretation. No deal is called a success before the evidence arrives.</p></div><div class="deals">${cards(deals.slice(0,3))}</div><div style="text-align:center;margin-top:28px"><a class="text-link" href="#library">Browse all research <span class="arrow">↗</span></a></div></div></section><section class="section hairline"><div class="wrap"><div class="sectionhead"><div><span class="eyebrow">THE THINKING PROCESS</span><h2 class="section-title">A story with a framework.</h2></div><p class="subhead">Every article moves through the business problem, strategic options, the transaction and an honest verdict.</p></div><div class="steps"><div class="step"><b>01.</b><h3>Find the tension</h3><p>What industry change forces a company to reconsider its future?</p></div><div class="step"><b>02.</b><h3>Challenge the choice</h3><p>Would building or partnering create more value than buying?</p></div><div class="step"><b>03.</b><h3>Test the economics</h3><p>Price, consideration, synergies, financing and downside cases.</p></div><div class="step"><b>04.</b><h3>Form a view</h3><p>Who benefits, who pays, and what could disprove the thesis?</p></div></div><p style="margin-top:24px"><a class="text-link" href="#framework">Explore the seven-stage framework <span class="arrow">↗</span></a></p></div></section><div class="hairline"><div class="wrap about-strip"><div class="signature"><strong>${E((site.authorName||'Your Name').trim()[0]||'Y')}</strong></div><div><span class="eyebrow">THE PERSON BEHIND THE PAGES</span><h2>Independent, by design.</h2><p>${E(site.authorBio)}</p><a class="text-link" href="#about">Meet the writer <span class="arrow">↗</span></a></div></div></div>`}
function library(){let result=deals.filter(d=>(filter==='All'||d.theme===filter)&&[d.title,d.buyer,d.target,d.sector,d.hook,d.bigIdea].join(' ').toLowerCase().includes(query));return `<section class="page-heading"><div class="wrap"><span class="eyebrow">THE RESEARCH ARCHIVE</span><h1>Deal library.</h1><p class="subhead">An evolving notebook of acquisitions, strategic motives and financial questions. Cases reflect the source review date, not a live deal feed.</p><div class="filterline"><input class="searchfield" id="search" value="${E(query)}" placeholder="Search a company or deal..." aria-label="Search deals">${['All',...new Set(deals.map(d=>d.theme))].map(x=>`<button class="filter ${filter===x?'active':''}" data-filter="${E(x)}">${E(x==='All'?'All sectors':x[0].toUpperCase()+x.slice(1))}</button>`).join('')}</div></div></section><section style="padding-bottom:90px"><div class="wrap"><div class="deals">${cards(result)}</div>${result.length?'':`<div class="empty">No published deals match this search. Try another company or sector.</div>`}<p class="tiny" style="margin-top:25px">Reviewed ${date(site.lastReviewed||'2026-11-06')} · Each article links its original sources and distinguishes announced terms from completed results.</p></div></section>`}
function article(d){const inner=mode==='story'?story(d):analyst(d);return `<section class="article-hero"><div class="wrap"><div class="article-top"><a class="text-link" href="#library">← Back to deals</a><span class="eyebrow">${E(d.sector)}</span></div><h1>${E(d.title)}</h1><p class="deck">${E(d.subtitle)}</p><div class="article-meta"><span>${E(d.buyer)} <strong>×</strong> ${E(d.target)}</span><span>${date(d.announced)}</span><span>${E(d.status)}</span></div><blockquote class="article-quote">${E(d.hook)}</blockquote>${figure(d.heroImage,d.heroAlt||d.title,d.heroCaption,"feature-photo")}<div class="numbers"><div class="number"><label>Announced transaction value</label><b>${E(d.value)}</b></div><div class="number"><label>Consideration / financing</label><b>${E(d.structure)}</b></div><div class="number"><label>Expected close — not completed</label><b>${E(d.expectedClose)}</b></div></div></div></section><div class="article-toolbar"><div class="wrap"><button class="modebtn ${mode==='story'?'active':''}" data-mode="story">01 &nbsp; The story</button><button class="modebtn ${mode==='analyst'?'active':''}" data-mode="analyst">02 &nbsp; Analyst notes</button><span class="toolbar-status">Analysis / not investment advice</span></div></div><section class="wrap article-body"><aside class="article-sidebar"><div class="eyebrow">ON THIS PAGE</div>${(mode==='story'?d.stages.map((s,i)=>({id:'chapter'+i,txt:(i+1).toString().padStart(2,'0')+'. '+s.title})):[{id:'ap0',txt:'Deal facts'},{id:'ap1',txt:'Strategic thesis'},{id:'ap2',txt:'Alternative choices'},{id:'ap3',txt:'Bull vs. bear'},{id:'apCui',txt:'Cui Bono test'},{id:'ap4',txt:'Research assignment'}]).map(it=>`<button class="toc-link" onclick="document.getElementById('${it.id}').scrollIntoView({behavior:'smooth'})">${E(it.txt)}</button>`).join('')}<div style="margin-top:28px"><a class="text-link" href="#framework">The method ↗</a></div></aside><div class="article-main">${inner}<div class="sources"><div class="eyebrow">PRIMARY SOURCES / REFERENCE FILE</div>${(d.sources||[]).map(s=>`<a href="${safe(s.url)}" target="_blank" rel="noopener noreferrer">↗ ${E(s.label)}</a>`).join('')}<p class="tiny">Source links are the starting point for independent verification, not an endorsement of management forecasts. Transaction status is as of ${date(site.lastReviewed||'2026-11-06')}.</p></div><div class="note">Editorial note: factual transaction terms are taken from company announcements. Strategic interpretations, scenarios and questions are original analysis. Future outcomes are uncertain.</div></div></section>`}
function story(d){return `<p class="story-intro">${E(d.hook)} Start with the announced transaction. Then examine each company, connect their economics, and test whether ownership creates value.</p>${d.stages.map((s,i)=>`<section class="chapter" id="chapter${i}"><div class="chapter-top"><span>${String(i+1).padStart(2,'0')} /</span><h2>${E(s.title)}</h2></div><p>${E(s.text)}</p>${figure(s.image,s.alt||s.title,s.caption)}${i===3&&d.fitBuyerNeed&&d.fitTargetAsset&&d.fitMechanism?`<div class="connection-map"><div class="conn-heading">THE STRATEGIC CONNECTION / HYPOTHESIS TO TEST</div><div class="conn-grid"><div><small>BUYER NEED</small><p>${E(d.fitBuyerNeed)}</p></div><div class="conn-arrow">→</div><div><small>TARGET ASSET</small><p>${E(d.fitTargetAsset)}</p></div></div><div class="conn-result"><small>PROPOSED MECHANISM — NOT A GUARANTEED SYNERGY</small><p>${E(d.fitMechanism)}</p></div></div>`:""}${s.evidence||s.counterargument?`<div class="proof-pair">${s.evidence?`<div><small>EVIDENCE / WHAT THE SOURCE SUPPORTS</small><p>${E(s.evidence)}</p></div>`:""}${s.counterargument?`<div><small>COUNTERARGUMENT / WHAT COULD BE WRONG</small><p>${E(s.counterargument)}</p></div>`:""}</div>`:""}<div class="questionbox"><small>ANALYST'S QUESTION</small><p>${E(prompts[i])}</p></div><div class="cui-lens"><small>CUI BONO? / WHO BENEFITS AT THIS STAGE</small><p>${E(s.benefitLens||'Before proceeding: who gains, who pays, and whose incentives change?')}</p></div></section>`).join('')}<div class="cui-summary" id="cui-summary"><span class="eyebrow">THE CUI BONO TEST</span><h2>Who actually benefits?</h2><p>${E(d.cuiBono||'The incentives and costs still need to be investigated.')}</p><a class="text-link" href="#deal/${encodeURIComponent(d.id)}" data-goto-analyst="${E(d.id)}">Read the stakeholder analysis →</a></div><div class="idea"><small>THE BIG IDEA</small><p>${E(d.bigIdea)}</p></div><a class="btn" href="#deal/${encodeURIComponent(d.id)}" data-goto-analyst="${E(d.id)}">Open analyst notes →</a>`}
function analyst(d){return `<p class="story-intro">A compelling story is the beginning. The job of an analyst is to test the story against money, alternatives and uncertainty.</p><div class="analyst-panel" id="ap0"><div class="analyst-label">01 / SOURCE-BASED FACTS</div><h2>What has actually been announced?</h2><p>${E(d.dealFacts)}</p></div><div class="analyst-panel" id="ap1"><div class="analyst-label">02 / STRATEGIC INFERENCE</div><h2>What does the buyer really want?</h2><p>${E(d.analystThesis)}</p></div><div class="analyst-panel" id="ap2"><div class="analyst-label">03 / COUNTERFACTUAL</div><h2>Buy, build or partner?</h2><p>${E(d.alternatives)}</p></div><div class="analyst-panel" id="ap3"><div class="analyst-label">04 / INVESTMENT DEBATE</div><h2>The case for—and against.</h2><div class="analyst-grid"><div class="mini-panel"><span class="eyebrow">THE UPSIDE CASE</span><h3>Why this could work</h3><p>${E(d.upside)}</p></div><div class="mini-panel"><span class="eyebrow">THE DOWNSIDE CASE</span><h3>What could break the thesis</h3><p>${E(d.downside)}</p></div></div></div><div class="analyst-panel cui-beneficiary" id="apCui"><div class="analyst-label">THE CUI BONO TEST / REQUIRED INVESTIGATION</div><h2>Who benefits—and at whose expense?</h2><p>${E(d.cuiBono||'This question has not yet been answered.')}</p><div class="stakeholder-grid"><div><span>01 / ACQUIRER SHAREHOLDERS</span><p>${E(d.buyerBenefit||'Not established.')}</p></div><div><span>02 / TARGET SHAREHOLDERS</span><p>${E(d.targetBenefit||'Not established.')}</p></div><div><span>03 / CUSTOMERS, EMPLOYEES & RIVALS</span><p>${E(d.otherStakeholders||'Not established.')}</p></div><div><span>04 / WHO PAYS / BEARS RISK</span><p>${E(d.costBearers||'Not established.')}</p></div></div><div class="cui-caveat"><b>THE TESTABLE QUESTION</b><p>${E(d.evidenceGap||'What information would show whether the expected benefits actually reach shareholders and customers?')}</p></div></div><div class="analyst-panel" id="ap4"><div class="analyst-label">05 / MONITOR & REVISIT</div><h2>What would change your mind?</h2><p>${E(d.whatToWatch)}</p><div class="questionbox"><small>TRY THIS</small><p>Write a two-sentence verdict. First: why the deal makes strategic sense. Second: which missing financial evidence prevents a final valuation conclusion.</p></div></div><div class="brainstorm"><h3>Your private research notebook</h3><p class="tiny">Write your own thesis, objections or follow-up questions. This note stays in this browser and is not published to the website.</p><textarea id="reader-note" placeholder="My thesis: ...\nThe biggest unanswered question: ...\nWhat would change my view: ..."></textarea><button class="btn" id="save-note" data-id="${E(d.id)}">Save notebook</button><span class="saveflag" id="saveflag"></span></div>`}
function framework(){return `<section class="page-heading"><div class="wrap"><span class="eyebrow">THE CUI BONO METHOD / DEAL-FIRST STORYTELLING</span><h1>What happened. Why these two. Who benefits.</h1><p class="subhead">Every case begins with the deal, introduces each business, then connects the two. Evidence, counterarguments and the Cui Bono test appear in every chapter before the final verdict.</p></div></section><section class="wrap"><div class="guidegrid">${[['01','The deal','Start with buyer, target, announcement date, transaction terms and current status.','Which facts are signed, and what remains conditional?'],['02','The acquirer','Understand the buyer’s business model, economics, competitive moat and strategic problem.','What capability or growth engine is missing?'],['03','The target','Understand the seller’s customers, technology, revenue quality and hard-to-copy assets.','What is valuable beyond the headline price?'],['04','The connection','Draw the line from the buyer’s need through the target’s assets to a specific cash-flow mechanism.','What exactly changes after combining the businesses?'],['05','Why buy, why now','Compare acquiring against building, partnering and doing nothing.','Why does ownership beat a contract, and why now?'],['06','The economics','Separate equity value and EV, assess financing, dilution, synergies, integration cost and downside valuation.','Can incremental after-tax cash flows justify the full cost?'],['07','The Cui Bono verdict','Map gains, costs and risks by stakeholder; give a conditional view and measurable revision triggers.','Who captures the value, and what observation would prove you wrong?']].map(([n,t,d,q])=>`<div class="guide-step"><span class="count">${n}.</span><h3>${t}</h3><p>${d}</p><div class="guidetip">${q}</div></div>`).join('')}<div class="guide-step" style="background:var(--navy);color:white"><span class="count" style="color:#e0b395">CHECK.</span><h3>Evidence → Challenge → Cui Bono</h3><p style="color:#c2d0d1">Every stage needs a source-backed observation, a serious alternative explanation, and an explicit map of who gains or pays. The writing studio enforces this before publishing.</p><div class="guidetip" style="color:#e5c8b5;border-color:#ffffff35">The strategic fit may be clear while the price remains too high.</div></div></div></section>`} 
function about(){let email=site.contactEmail&&/^\S+@\S+\.\S+$/.test(site.contactEmail),linked=site.linkedin&&/^https:\/\//.test(site.linkedin);return `<section class="wrap about-page"><div class="signature"><strong>${E((site.authorName||'Y')[0])}</strong></div><div><span class="eyebrow">ABOUT THE WRITER</span><h1>${E(site.authorName||'Your Name')}</h1><p><strong style="color:var(--ink)">${E(site.authorTitle||'Independent writer')}</strong></p><p>${E(site.authorBio)}</p><p>This project is a working record of how I think: what I can establish from documents, what I infer from strategy, and what I still need to investigate. Each article is an invitation to examine the evidence—not a claim to know every answer.</p><div class="principles"><div class="principle"><b>Curiosity</b><p>Ask who benefits before declaring a deal successful.</p></div><div class="principle"><b>Evidence</b><p>Ground transaction terms in original documents.</p></div><div class="principle"><b>Humility</b><p>Keep opinions distinct from verified outcomes.</p></div></div><p style="margin-top:33px">${email?`<a class="text-link" href="mailto:${E(site.contactEmail)}">Email the writer ↗</a>`:''}${linked?` &nbsp; <a class="text-link" href="${safe(site.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:''}</p><p class="tiny">This is an independent personal project and is not affiliated with the companies covered.</p></div></section>`}
function route(){document.getElementById('nav').classList.remove('open');let parts=decodeURIComponent((location.hash||'#home').slice(1)).split('/');let page=parts[0]||'home';document.querySelectorAll('.nav [data-route]').forEach(b=>b.classList.toggle('selected',b.dataset.route===page||(page==='deal'&&b.dataset.route==='library')));if(page==='home')app.innerHTML=home();else if(page==='library')app.innerHTML=library();else if(page==='framework')app.innerHTML=framework();else if(page==='about')app.innerHTML=about();else if(page==='deal'){let d=deals.find(x=>x.id===parts.slice(1).join('/'));app.innerHTML=d?article(d):`<section class="page-heading wrap"><h1>Deal not found.</h1><a href="#library">Back to library</a></section>`;if(d&&mode==='analyst'){let el=document.getElementById('reader-note');if(el)try{el.value=localStorage.getItem('dt-reader-'+d.id)||''}catch(e){}}}else{location.hash='home';return}window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;let active=document.activeElement;app.innerHTML=library();let inp=document.getElementById('search');if(inp){inp.value=query;if(active&&active.id==='search')inp.focus();}return;}let b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;route();return;}let a=e.target.closest('[data-goto-analyst]');if(a){e.preventDefault();mode='analyst';route();return;}let s=e.target.closest('#save-note');if(s){try{localStorage.setItem('dt-reader-'+s.dataset.id,document.getElementById('reader-note').value);document.getElementById('saveflag').textContent='Saved on this device';}catch(ex){document.getElementById('saveflag').textContent='Browser storage unavailable';}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value.toLowerCase();let inp=e.target;let pos=inp.selectionStart;app.innerHTML=library();inp=document.getElementById('search');inp.focus();inp.setSelectionRange(pos,pos);}});document.getElementById('menu').onclick=()=>document.getElementById('nav').classList.toggle('open');window.addEventListener('hashchange',()=>{mode='story';route()});route();
})();
</script>
</body></html>
